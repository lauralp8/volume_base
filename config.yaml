# Configuration file for NetApp ONTAP automation scripts
# Version: 1.0.0
# ============================================================================

# CLUSTER CONNECTION SETTINGS
cluster:
  host: cluster1.demo.netapp.com            
  username: admin
  password: "Netapp1!"

# STORAGE VIRTUAL MACHINE (SVM) SETTINGS
svm:
  name: svm_1_cluster

# VOLUME SETTINGS
volume:
  name: vol_data_01                
  vserver: svm_1_cluster           
  aggregate: cluster1_01_SSD_1                ¡
  size: 500GB
  security_style: unix
  junction_path: "/vol_data_01"       
  export_policy: default
  unix_permissions: rwxrwxrwx
